<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Abbinamenti · Sissi Fine Foods</title>
    <meta name="description" content="Strumento interno di Sissi Fine Foods: con cosa abbinare i prodotti del listino, quali vini e cosa evitare.">
    <meta name="theme-color" content="#1F3A2E">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Abbinamenti">
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest">
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml">
    <link rel="icon" href="%BASE_URL%icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png">
    <link rel="preload" href="%BASE_URL%brand/logo-sissi.png" as="image">
  </head>
  <body data-vista="ricerca">
    <a class="salta" href="#contenuto">Vai alla scheda</a>
    <div class="tacca" aria-hidden="true"></div>

    <header class="testata">
      <a class="marchio" href="#/" aria-label="Abbinamenti, torna alla ricerca">
        <img src="%BASE_URL%brand/logo-sissi.png" alt="Sissi Fine Foods" width="320" height="211">
      </a>
      <div class="testata-titolo">
        <span class="titolo-app">Abbinamenti</span>
      </div>
      <nav class="testata-nav" aria-label="Sezioni">
        <a href="#/" class="nav-link" data-nav="ricerca">Cerca</a>
        <a href="#/famiglie" class="nav-link" data-nav="famiglie">Famiglie</a>
      </nav>
    </header>

    <main class="corpo">
      <section class="colonna-ricerca" aria-label="Ricerca prodotti">
        <form class="barra-ricerca" role="search" action="#/">
          <label class="etichetta-campo" for="q">Cerca un prodotto</label>
          <div class="campo">
            <svg class="lente" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
            <input id="q" name="q" type="search" placeholder="Nome, marca, vino, gusto…"
              autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
              enterkeyhint="search" aria-describedby="stato">
            <button type="button" class="pulisci" aria-label="Cancella la ricerca" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </div>
        </form>
        <div class="scorciatoie" aria-label="Ricerche veloci" role="group">
          <span class="scorciatoie-etichetta">Prova</span>
          <button type="button" data-q="Casa Iuorio">Casa Iuorio</button>
          <button type="button" data-q="piccante">piccante</button>
          <button type="button" data-q="bollicine">bollicine</button>
          <button type="button" data-q="fondente">fondente</button>
          <button type="button" data-q="Amarone">Amarone</button>
          <button type="button" data-q="regalo">regalo</button>
        </div>
        <p id="stato" class="stato" aria-live="polite">Carico il listino…</p>
        <ul id="risultati" class="risultati" aria-label="Risultati"></ul>
        <nav id="sfoglia" class="sfoglia" aria-labelledby="sfoglia-titolo" hidden>
          <h2 id="sfoglia-titolo" class="etichetta">Sfoglia le famiglie</h2>
          <ul class="sfoglia-elenco"></ul>
        </nav>
      </section>

      <section id="contenuto" class="colonna-scheda" aria-label="Scheda" tabindex="-1">
        <div class="barra-indietro">
          <a href="#/" class="indietro"><span aria-hidden="true">←</span> Ricerca</a>
        </div>
        <div id="vista" class="vista"></div>
      </section>
    </main>

    <noscript><p class="noscript">Per usare gli abbinamenti serve JavaScript.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
